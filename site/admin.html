<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>CULTRAE — Site Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #0b0b0d; --panel: #141418; --panel-2: #1b1b21; --line: #2a2a32;
      --bone: #ece7dd; --muted: #9a958c; --faint: #6a665f;
      --brass: #c9a06a; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --sans: 'Inter', system-ui, sans-serif;
      --display: 'Cormorant Garamond', Georgia, serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--ink); color: var(--bone);
      font-family: var(--sans); font-size: 14px; height: 100vh; overflow: hidden;
    }
    a { color: var(--brass); text-decoration: none; }

    /* ---------- top bar ---------- */
    .top {
      height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
      background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .top .logo {
      font-family: var(--display); font-size: 19px; font-weight: 600;
      letter-spacing: .3em; text-transform: uppercase;
    }
    .top .sep { width: 1px; height: 24px; background: var(--line); }
    .chip {
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
    }
    .chip.dirty { color: var(--warn); border-color: #6b4d09; }
    .chip.saved { color: var(--ok); border-color: #14532d; }
    .top .grow { flex: 1; }
    .devices { display: flex; gap: 4px; background: var(--panel-2); border-radius: 8px; padding: 3px; }
    .devices button {
      border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 6px;
      padding: 6px 11px; font-size: 11.5px; font-family: var(--sans); font-weight: 600;
    }
    .devices button.on { background: var(--brass); color: #17140f; }

    .btn {
      border: 1px solid var(--line); background: var(--panel-2); color: var(--bone);
      border-radius: 8px; padding: 8px 15px; font-size: 12.5px; font-weight: 600;
      font-family: var(--sans); cursor: pointer; white-space: nowrap;
    }
    .btn:hover { border-color: var(--brass); color: var(--brass); }
    .btn.primary { background: var(--brass); border-color: var(--brass); color: #17140f; }
    .btn.primary:hover { background: #d8b07a; color: #17140f; }
    .btn.sm { padding: 5px 10px; font-size: 11.5px; }
    .btn.danger:hover { border-color: var(--bad); color: var(--bad); }

    /* ---------- layout ---------- */
    .shell { display: flex; height: calc(100vh - 56px); }
    .editor {
      width: 420px; flex-shrink: 0; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; background: var(--panel);
    }
    .tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; }
    .tabs button {
      flex: 1; border: 0; background: none; color: var(--muted); cursor: pointer;
      padding: 12px 6px; font-size: 11.5px; font-weight: 600; font-family: var(--sans);
      letter-spacing: .06em; border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .tabs button.on { color: var(--brass); border-bottom-color: var(--brass); }
    .panes { flex: 1; overflow-y: auto; padding: 16px; }
    .pane { display: none; }
    .pane.on { display: block; }

    .preview-wrap {
      flex: 1; background: #050506; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; overflow: hidden; padding: 14px;
    }
    #frame {
      width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px;
      background: var(--ink); transition: width .3s, height .3s;
    }
    #frame.mobile { width: 390px; }
    #frame.tablet { width: 820px; }

    /* ---------- form bits ---------- */
    .group { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .group > summary {
      list-style: none; cursor: pointer; padding: 12px 14px; background: var(--panel-2);
      font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--bone);
      display: flex; align-items: center; gap: 8px;
    }
    .group > summary::-webkit-details-marker { display: none; }
    .group > summary::before { content: '▸'; color: var(--brass); transition: transform .2s; }
    .group[open] > summary::before { transform: rotate(90deg); }
    .group .inner { padding: 14px; }
    .fld { margin-bottom: 13px; }
    .fld:last-child { margin-bottom: 0; }
    .fld label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .04em; }
    .fld .hint { font-size: 10.5px; color: var(--faint); margin-top: 4px; line-height: 1.5; }
    input[type=text], input[type=url], input[type=number], textarea, select {
      width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
      padding: 9px 11px; color: var(--bone); font-family: var(--sans); font-size: 13px; outline: none;
    }
    textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
    input:focus, textarea:focus, select:focus { border-color: var(--brass); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-inline { display: flex; gap: 8px; align-items: center; }
    .swatch { display: flex; align-items: center; gap: 9px; }
    .swatch input[type=color] {
      width: 38px; height: 34px; padding: 0; border: 1px solid var(--line);
      border-radius: 7px; background: none; cursor: pointer; flex-shrink: 0;
    }
    .swatch input[type=text] { font-family: ui-monospace, monospace; font-size: 12px; }
    input[type=range] { width: 100%; accent-color: var(--brass); }
    .rng-val { font-size: 11px; color: var(--brass); font-family: ui-monospace, monospace; float: right; }
    .tog { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
    .tog span { font-size: 12.5px; color: var(--bone); }
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 999px; cursor: pointer; transition: .2s;
    }
    .slider::before {
      content: ''; position: absolute; width: 15px; height: 15px; left: 3px; top: 2.5px;
      background: var(--muted); border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: var(--brass); border-color: var(--brass); }
    .switch input:checked + .slider::before { transform: translateX(17px); background: #17140f; }

    .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .preset {
      border: 1px solid var(--line); border-radius: 9px; padding: 9px; cursor: pointer;
      background: var(--panel-2); text-align: left;
    }
    .preset:hover { border-color: var(--brass); }
    .preset .dots { display: flex; gap: 4px; margin-bottom: 7px; }
    .preset .dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); }
    .preset .nm { font-size: 11px; color: var(--bone); font-weight: 600; }

    /* item cards (sections, list items, social) */
    .item {
      border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; background: var(--panel-2);
    }
    .item-head {
      display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer;
    }
    .item-head .t { flex: 1; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-head .badge { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
    .icobtn {
      border: 1px solid var(--line); background: var(--ink); color: var(--muted); cursor: pointer;
      width: 26px; height: 26px; border-radius: 6px; font-size: 12px; line-height: 1; flex-shrink: 0;
    }
    .icobtn:hover { border-color: var(--brass); color: var(--brass); }
    .item-body { padding: 0 11px 12px; display: none; }
    .item.open .item-body { display: block; }
    .off { opacity: .45; }

    .icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
    .icon-grid button {
      aspect-ratio: 1; border: 1px solid var(--line); background: var(--ink); border-radius: 7px;
      cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 5px;
    }
    .icon-grid button svg { width: 100%; height: 100%; fill: currentColor; }
    .icon-grid button.on { border-color: var(--brass); color: var(--brass); background: #241d12; }
    .icon-grid button.none { font-size: 10px; }

    .note { font-size: 11.5px; color: var(--muted); line-height: 1.6; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; margin-bottom: 12px; }
    .note b { color: var(--bone); }
    .note.warn { border-color: #6b4d09; background: #241d0b; color: #f3d38a; }
    #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 15px; font-size: 12.5px; box-shadow: 0 10px 26px rgba(0,0,0,.6); max-width: 320px; }
    .toast.err { border-color: var(--bad); color: #fecaca; }
    .addbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    @media (max-width: 700px) {
      /* keep only the primary action up top — Download/Reset live in the Publish tab */
      #btn-reset, #btn-export { display: none; }
      .top { gap: 10px; padding: 0 10px; }
      .top .logo { font-size: 16px; letter-spacing: .2em; }
      #state-chip { display: none; }
    }
    @media (max-width: 1000px) {
      .shell { flex-direction: column; }
      .editor { width: 100%; height: 62%; border-right: 0; border-bottom: 1px solid var(--line); }
      .preview-wrap { height: 38%; }
      #frame.mobile, #frame.tablet { width: 100%; }
      .devices { display: none; }
    }
  </style>
</head>
<body>

  <div class="top">
    <div class="logo">Cultrae</div>
    <div class="sep"></div>
    <span class="chip" id="state-chip">No changes</span>
    <div class="grow"></div>
    <div class="devices" id="devices">
      <button data-w="full" class="on" type="button">Desktop</button>
      <button data-w="tablet" type="button">Tablet</button>
      <button data-w="mobile" type="button">Mobile</button>
    </div>
    <button class="btn" id="btn-reset" type="button">Reset</button>
    <button class="btn" id="btn-export" type="button">Download</button>
    <button class="btn primary" id="btn-apply" type="button">Apply to site</button>
  </div>

  <div class="shell">
    <div class="editor">
      <div class="tabs" id="tabs">
        <button data-t="design" class="on" type="button">Design</button>
        <button data-t="content" type="button">Content</button>
        <button data-t="sections" type="button">Sections</button>
        <button data-t="footer" type="button">Footer</button>
        <button data-t="publish" type="button">Publish</button>
      </div>
      <div class="panes">
        <div class="pane on" id="pane-design"></div>
        <div class="pane" id="pane-content"></div>
        <div class="pane" id="pane-sections"></div>
        <div class="pane" id="pane-footer"></div>
        <div class="pane" id="pane-publish"></div>
      </div>
    </div>

    <div class="preview-wrap">
      <iframe id="frame" src="index.html" title="Live preview"></iframe>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="render.js"></script>
  <script src="publish-config.js"></script>
  <script src="admin-cultrae.js"></script>
</body>
</html>
